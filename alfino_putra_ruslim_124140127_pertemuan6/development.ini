[app:main]
use = egg:pyramid_mahasiswa
pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes =
    pyramid_debugtoolbar

# Gunakan environment variable DATABASE_URL untuk kredensial lokal.
# URL tanpa password ini hanya menjadi contoh aman di repository.
sqlalchemy.url = postgresql+psycopg2://pyramid_user@localhost:5432/pyramid_mahasiswa

[server:main]
use = egg:waitress#main
listen = localhost:6543

[loggers]
keys = root, pyramid_mahasiswa, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyramid_mahasiswa]
level = DEBUG
handlers =
qualname = pyramid_mahasiswa

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s

[alembic]
script_location = pyramid_mahasiswa:alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url = postgresql+psycopg2://pyramid_user@localhost:5432/pyramid_mahasiswa

[logger_alembic]
level = INFO
handlers = console
qualname = alembic
